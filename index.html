<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Elaris</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,500&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Cinzel:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#ece2c9; --paper-dim:#e2d6b4; --ink:#2c2216; --ink-soft:#5a4c38;
  --gold:#8a6a2f; --gold-bright:#b48a3e; --gold-glow:#d8b25e;
  --bg1:#100c07; --bg2:#1e160c; --panel:#1a140c; --panel-2:#241a10;
  --line: rgba(184,142,62,.28); --danger:#a5433a; --good:#5a7a4a;
  --accent-text: var(--gold-glow);
}
:root:not([data-theme="light"]){
  --bg-body: radial-gradient(ellipse at 50% -10%, var(--bg2), var(--bg1) 70%);
  --surface: var(--panel); --surface-2: var(--panel-2);
  --text: #e7dcc2; --text-soft:#b6a684; --text-dim:#8b7c62;
  --card-border: var(--line);
}
:root[data-theme="light"]{
  --bg-body: radial-gradient(ellipse at 50% -10%, var(--paper), var(--paper-dim) 85%);
  --surface: #f4ecd6; --surface-2: #ede0bf;
  --text: var(--ink); --text-soft: var(--ink-soft); --text-dim:#8a7a5c;
  --card-border: rgba(90,76,56,.25);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg-body: radial-gradient(ellipse at 50% -10%, var(--paper), var(--paper-dim) 85%);
    --surface: #f4ecd6; --surface-2: #ede0bf;
    --text: var(--ink); --text-soft: var(--ink-soft); --text-dim:#8a7a5c;
    --card-border: rgba(90,76,56,.25);
  }
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; height:100%;}
body{
  background: var(--bg-body); background-attachment:fixed;
  font-family:'EB Garamond', serif; color:var(--text); min-height:100dvh;
}
::selection{ background: var(--gold); color:#1a140c; }
h1,h2,h3,h4,.display{ font-family:'Cormorant Garamond', serif; font-weight:600; letter-spacing:.01em; margin:0; color:var(--text); }
.brandmark{ font-family:'Cinzel', serif; letter-spacing:.14em; }
a{color:inherit;}
button{ font-family:inherit; cursor:pointer; }
.scrollbar::-webkit-scrollbar{width:8px; height:8px;}
.scrollbar::-webkit-scrollbar-thumb{background:var(--card-border); border-radius:4px;}

#app{ display:flex; min-height:100dvh; }

/* ---------- Cover ---------- */
.cover{ position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center;
  background: radial-gradient(ellipse at 50% 20%, #241a0f, #0c0906 78%); transition:opacity .5s ease, visibility .5s ease; }
.cover.hidden{opacity:0; visibility:hidden; pointer-events:none;}
.cover-frame{ text-align:center; max-width:560px; padding:0 24px; }
.cover-frame .brandmark{ font-size: clamp(2.6rem,8vw,4.2rem); color:var(--gold-glow); text-shadow:0 0 40px rgba(216,178,94,.25); }
.cover-frame .tagline{ margin-top:10px; color:var(--text-dim); font-style:italic; font-size:1.05rem; }
.cover-frame .ornament{ width:120px; height:1px; background:linear-gradient(90deg,transparent,var(--gold),transparent); margin:26px auto; }
.cover-actions{ display:flex; gap:14px; justify-content:center; margin-top:30px; flex-wrap:wrap;}
.btn{ border:1px solid var(--card-border); background:var(--surface); color:var(--text); padding:11px 22px;
  border-radius:3px; font-size:.95rem; letter-spacing:.04em; transition:border-color .15s, transform .1s;}
.btn:hover{ border-color:var(--gold); }
.btn:active{ transform: scale(.98); }
.btn-gold{ background:linear-gradient(180deg, var(--gold-bright), var(--gold)); color:#1a1206; border:1px solid var(--gold-bright); font-weight:600;}
.btn-gold:hover{ filter:brightness(1.08); }
.btn-ghost{ background:transparent; }
.btn-danger{border-color:var(--danger); color:var(--danger);}
.btn:disabled{opacity:.45; cursor:not-allowed;}
.cover-note{ margin-top:22px; color:var(--text-dim); font-size:.82rem; }

/* ---------- Sidebar ---------- */
.sidebar{ width:230px; flex:none; background:var(--surface); border-right:1px solid var(--card-border);
  display:flex; flex-direction:column; height:100dvh; position:sticky; top:0; z-index:20; }
.sidebar.collapsed{ width:0; overflow:hidden; border:none;}
.sidebar-head{ padding:20px 18px 14px; border-bottom:1px solid var(--card-border);}
.sidebar-head .brandmark{ font-size:1.3rem; color:var(--gold-glow); }
.sidebar-head .sub{ font-size:.72rem; color:var(--text-dim); margin-top:3px; letter-spacing:.06em;}
.navlist{ list-style:none; margin:0; padding:10px; flex:1; overflow-y:auto; }
.navlist li{ margin-bottom:2px; }
.navbtn{ width:100%; text-align:left; background:none; border:none; color:var(--text-soft); padding:9px 12px;
  border-radius:4px; font-size:.95rem; display:flex; align-items:center; gap:10px; }
.navbtn:hover{ background:var(--surface-2); color:var(--text); }
.navbtn.active{ background:var(--surface-2); color:var(--gold-glow); font-weight:600; }
.navbtn .ic{ font-size:1.05em; width:1.2em; text-align:center; opacity:.85;}
.sidebar-foot{ padding:12px 18px; border-top:1px solid var(--card-border); font-size:.75rem; color:var(--text-dim);}
.progress-mini{ height:5px; background:var(--surface-2); border-radius:3px; overflow:hidden; margin-top:6px;}
.progress-mini > div{ height:100%; background:linear-gradient(90deg,var(--gold),var(--gold-glow)); }

/* ---------- Main ---------- */
.main{ flex:1; min-width:0; display:flex; flex-direction:column; height:100dvh; overflow:hidden;}
.topbar{ display:flex; align-items:center; gap:12px; padding:12px 20px; border-bottom:1px solid var(--card-border); flex:none;}
.topbar h2{ font-size:1.25rem; }
.topbar .meta{ color:var(--text-dim); font-size:.82rem; }
.iconbtn{ background:none; border:1px solid var(--card-border); color:var(--text-soft); border-radius:4px; width:34px; height:34px; }
.iconbtn:hover{ border-color:var(--gold); color:var(--gold-glow); }
.view{ flex:1; overflow-y:auto; padding: 22px 26px 60px; }
.view.no-pad{padding:0;}

/* ---------- Reader ---------- */
.reader-wrap{ max-width: 760px; margin: 0 auto; }
.reader-crumb{ font-size:.78rem; color:var(--text-dim); letter-spacing:.05em; text-transform:uppercase; margin-bottom:6px;}
.reader-title{ font-size:clamp(1.5rem,3vw,2.1rem); margin-bottom:4px;}
.reader-sub{ color:var(--text-dim); font-style:italic; margin-bottom:22px; font-size:.95rem;}
.page-progress{ height:3px; background:var(--surface-2); border-radius:2px; margin:6px 0 26px; overflow:hidden;}
.page-progress>div{ height:100%; background:var(--gold); }
.page-text{ font-size: var(--reading-size,1.14rem); line-height: var(--reading-lh,1.75); text-align: var(--reading-align,left);
  max-width: var(--reading-width,68ch); margin:0 auto; white-space:pre-wrap; }
.page-text p{ margin: 0 0 1.1em; }
.empty-page{ text-align:center; padding:60px 20px; border:1px dashed var(--card-border); border-radius:8px; color:var(--text-dim);}
.empty-page h3{ color:var(--text-soft); margin-bottom:8px; font-size:1.3rem;}
.reader-nav{ display:flex; justify-content:space-between; align-items:center; margin-top:38px; gap:10px; max-width:68ch; margin-left:auto; margin-right:auto;}
.reader-nav .pagenum{ color:var(--text-dim); font-size:.85rem; }
.gen-bar{ max-width:68ch; margin: 30px auto 0; border-top:1px solid var(--card-border); padding-top:18px; }
.gen-row{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
.gen-status{ font-size:.85rem; color:var(--text-dim); margin-top:8px; min-height:1.2em;}
.stream-preview{ font-size:.95rem; color:var(--text-soft); border-left:2px solid var(--gold); padding-left:12px; margin-top:10px; white-space:pre-wrap; max-height:200px; overflow-y:auto;}

/* ---------- Cards / grids ---------- */
.grid{ display:grid; gap:14px; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); }
.card{ background:var(--surface); border:1px solid var(--card-border); border-radius:6px; padding:16px; }
.card h4{ font-size:1.1rem; margin-bottom:4px;}
.card .tag{ display:inline-block; font-size:.7rem; letter-spacing:.05em; color:var(--gold-glow); border:1px solid var(--line); border-radius:20px; padding:2px 9px; margin-bottom:8px;}
.card .desc{ color:var(--text-soft); font-size:.88rem; line-height:1.5; margin-top:6px;}
.card .row{ display:flex; justify-content:space-between; font-size:.78rem; color:var(--text-dim); margin-top:10px;}
.status-pill{ font-size:.7rem; padding:2px 8px; border-radius:20px; }
.status-locked{ background:rgba(255,255,255,.05); color:var(--text-dim); }
.status-progress{ background:rgba(180,138,62,.18); color:var(--gold-glow);}
.status-complete{ background:rgba(90,122,74,.22); color:#8fbf78;}

.book-chapters{ margin-top:8px; display:flex; flex-wrap:wrap; gap:6px;}
.chip{ font-size:.78rem; padding:4px 10px; border-radius:4px; background:var(--surface-2); border:1px solid transparent; color:var(--text-soft);}
.chip:hover{ border-color:var(--gold); color:var(--text); }
.chip.active{ border-color:var(--gold); color:var(--gold-glow); }
.chip.done{ color:#8fbf78; }

input[type=text], input[type=search], textarea, select{
  background:var(--surface-2); border:1px solid var(--card-border); color:var(--text); border-radius:4px;
  padding:9px 11px; font-family:inherit; font-size:.92rem; width:100%;
}
textarea{resize:vertical;}
label.field{ display:block; margin-bottom:14px; font-size:.85rem; color:var(--text-soft);}
label.field span{ display:block; margin-bottom:5px; }
.inline-controls{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:16px;}
.section-title{ font-size:1.4rem; margin-bottom:4px;}
.section-desc{ color:var(--text-dim); font-size:.9rem; margin-bottom:18px; }
.stat-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:12px; margin-bottom:24px;}
.stat{ background:var(--surface); border:1px solid var(--card-border); border-radius:6px; padding:14px 16px;}
.stat .num{ font-family:'Cormorant Garamond',serif; font-size:1.9rem; color:var(--gold-glow); line-height:1;}
.stat .lbl{ font-size:.78rem; color:var(--text-dim); margin-top:4px;}

.tablist{ display:flex; gap:6px; border-bottom:1px solid var(--card-border); margin-bottom:18px; flex-wrap:wrap;}
.tab{ background:none; border:none; color:var(--text-dim); padding:9px 14px; border-bottom:2px solid transparent; font-size:.92rem;}
.tab.active{ color:var(--gold-glow); border-bottom-color:var(--gold); }

.result-item{ padding:12px 0; border-bottom:1px solid var(--card-border); cursor:pointer;}
.result-item:hover .result-title{ color:var(--gold-glow); }
.result-title{ font-weight:600; }
.result-ctx{ color:var(--text-soft); font-size:.85rem; margin-top:3px; }
.result-snip{ color:var(--text-dim); font-size:.82rem; margin-top:4px;}
mark{ background:rgba(216,178,94,.35); color:inherit; border-radius:2px;}

.settings-grid{ display:grid; grid-template-columns: 1fr 1fr; gap:0 24px; max-width:680px;}
@media (max-width:640px){ .settings-grid{grid-template-columns:1fr;} }
.toggle-row{ display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--card-border);}
.switch{ position:relative; width:42px; height:24px; background:var(--surface-2); border-radius:12px; border:1px solid var(--card-border);}
.switch.on{ background:var(--gold); }
.switch .knob{ position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%; background:var(--paper); transition:left .15s;}
.switch.on .knob{ left:20px; background:#241a0f;}

.empty-state{ text-align:center; padding:50px 20px; color:var(--text-dim);}
.empty-state h3{ color:var(--text-soft); margin-bottom:6px;}

@media (max-width:820px){
  .sidebar{ position:fixed; z-index:40; box-shadow:0 0 40px rgba(0,0,0,.5); }
  .sidebar:not(.mobile-open){ transform: translateX(-100%); width:230px; }
  .view{ padding:16px 14px 50px; }
}
.toast{ position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:var(--surface); border:1px solid var(--gold);
  padding:10px 18px; border-radius:6px; font-size:.88rem; z-index:60; box-shadow:0 8px 24px rgba(0,0,0,.35); transition:opacity .3s, transform .3s; }
.toast.hidden{ opacity:0; transform:translate(-50%,10px); pointer-events:none;}
</style>
</head>
<body>

<div class="cover" id="cover">
  <div class="cover-frame">
    <div class="brandmark">ELÁRIS</div>
    <div class="tagline">Two names, one fall, thirty books of what came after.</div>
    <div class="ornament"></div>
    <div class="cover-actions">
      <button class="btn btn-gold" id="btn-start-reading">Begin Reading</button>
    </div>
    <div class="cover-note" id="cover-note">Loading your saga…</div>
  </div>
</div>

<div id="app"></div>

<div class="toast hidden" id="toast"></div>

<script>
/* =========================================================================
   ELÁRIS — data seed, storage layer, generation engine, UI
   ========================================================================= */

/* ---------------- Seed manuscript (Book One — kept intact, unedited) ---------------- */
const SEED_CHAPTERS = [
{title:"Prologue — The Rain", text:`The rain had started before sunset.\n\nBy midnight, it had become a storm.\n\nWater poured from the rooftops and raced along the streets in shining streams. Thunder rolled between the buildings, and lightning occasionally turned the entire city white for a fraction of a second.\n\nMost people had gone home hours ago.\n\nTwo had not.\n\nCuza walked beneath a useless umbrella, his jacket soaked through anyway. Beside him, Gren stepped around a puddle.\n\n"You know," Cuza said, "we could have stayed home."\n\nGren looked at him. "And do what?"\n\n"Literally anything."\n\n"I was bored."\n\n"You dragged me outside because you were bored?"\n\n"Yes."\n\nCuza stared at him. Gren smiled. "You're welcome."\n\n"For what?"\n\n"For giving you an exciting evening."\n\nCuza laughed. "You're an idiot."\n\n"And you're still walking with me."\n\n"That says more about me than it does about you."\n\nThey continued down the empty road. They had been friends for years. Best friends. The kind who could spend hours doing absolutely nothing and still somehow have a good time.\n\nNeither knew that this would be the last ordinary conversation they would ever have.\n\nCuza suddenly stopped. Gren took another step. "What?"\n\nCuza looked down. A thin crack ran beneath his shoe. "Was that there before?"\n\nGren crouched. "No."\n\nThe rainwater disappeared into the crack. Gren touched the pavement. Nothing. "Probably nothing."\n\nCuza nodded. Then— CRK. Another crack appeared. Then another. Then another.\n\nThe road trembled. Gren slowly stood. "Cuza."\n\n"I know."\n\nThe pavement began splitting apart. Cars rocked. A streetlight fell. The road dropped several centimeters.\n\n"Move!"\n\nThey turned. The street behind them cracked open. Cuza grabbed Gren. "RUN!"\n\nThey ran. But there was nowhere to go. The entire road collapsed. The pavement disappeared beneath their feet.\n\nFor one moment, Cuza saw the storm above. Then— darkness.`},
{title:"Chapter One — The Fall", text:`"CUZA!" Gren's voice echoed through the darkness.\n\n"GREN!" Cuza reached outward. Nothing. There were no walls. No ground. No sky. He was falling, but he couldn't feel wind. It was as if gravity itself had forgotten how to work.\n\n"WHERE ARE YOU?"\n\n"OVER HERE!"\n\n"I CAN'T SEE YOU!"\n\n"ME NEITHER!"\n\nCuza tried moving toward Gren's voice. He couldn't tell whether he was getting closer. Time became meaningless. Minutes. Hours. Maybe longer. They kept falling.\n\nEventually Gren called out: "Do you think there's a bottom?"\n\nCuza looked down into the endless black. "I hope so."\n\n"I don't think there is."\n\n"Don't say that."\n\n"I'm just being honest."\n\n"Be honest quietly."\n\nGren laughed. Even here. Even now. He could still make Cuza laugh.\n\nThen Cuza noticed something. A tiny point of light. Far below.\n\n"Gren." "What?" "Look."\n\nThe light grew. The darkness became blue. Then white. They were moving faster. The light swallowed everything. And suddenly— wind, clouds, sky, mountains, forest. A world. They were falling toward it.\n\n"WE'RE GOING TO HIT!"\n\n"THEN DO SOMETHING!"\n\n"I DON'T KNOW WHAT!"\n\nThey plunged through the clouds. Cuza closed his eyes. Everything went white.`},
{title:"Chapter Two — Elaris", text:`Cuza woke on grass. He opened his eyes. Blue sky. Sunlight. Clouds. He sat up. The rain was gone. The road was gone. The city was gone.\n\nGren groaned nearby. "You alive?"\n\n"Unfortunately."\n\nCuza laughed. Gren sat up. Then he stopped. They both stared.\n\nThe plateau stretched for miles. Strange trees grew along the horizon. Some had purple bark. Some had glowing leaves. Massive mountains surrounded the land. A bird with four wings flew overhead.\n\nGren pointed. "That bird has four wings."\n\n"I noticed."\n\n"That's weird."\n\n"Very."\n\nThey explored. They found silver water. Flowers that moved. Creatures they couldn't name. And enormous footprints.\n\nThen something roared beyond the mountains. The entire plateau shook. Cuza stared toward the sound. "What was that?"\n\nGren swallowed. "I don't know."\n\nA tiny machine appeared overhead. A red light scanned them. "IDENTIFY YOURSELVES."\n\nCuza raised his hands. "Cuza."\n\n"SECOND INDIVIDUAL."\n\n"Gren."\n\n"SPECIES?" "Human." "ORIGIN?"\n\nCuza hesitated. "Eldermere."\n\n"PURPOSE?" "Travel."\n\nThe machine scanned them. "IDENTIFICATION ACCEPTED."\n\nMore machines appeared. They were escorted toward a distant walled city. Its name was Gronsrock.\n\nAnd Cuza's first mistake in Elaris had already been made. He had lied about where they came from.`},
{title:"Chapter Three — Gronsrock", text:`Gronsrock looked impressive. Huge stone walls surrounded it. Towers rose above crowded streets. Markets overflowed with food, weapons, clothing, magical objects and strange creatures.\n\nAt first, Gren loved it. "This place is incredible."\n\nCuza smiled. "It is."\n\nBut the longer they stayed, the more they noticed. A rich man pushed a merchant aside. The guards ignored it. A powerful citizen attacked someone. Nobody stopped him. A poor family begged for help. A guard walked past.\n\nGren's expression darkened. "This place is broken."\n\nCuza looked at him. "Maybe."\n\n"We should do something."\n\n"Gren."\n\nGren turned. "Let's fix them."\n\nCuza grabbed his arm. "Wait."\n\nGren pulled away. "You don't understand."\n\n"I understand enough."\n\n"No." Gren looked at the city. "They don't care about each other." His voice became colder. "So why should I care about them?"\n\nThen he walked away. Cuza followed. "Gren!" He didn't stop.\n\nThe first explosion shook Gronsrock. Then another. And another. Magic tore through buildings. People screamed. Guards ran. Gren moved through the city with terrifying power. Cuza couldn't understand what he was seeing. His best friend was destroying everything.\n\n"GREN!"\n\nGren looked back once. For a moment, Cuza saw the old Gren. Then it was gone.\n\nThe city fell. By the time the army reached them, Gronsrock was ruined. Cuza stood among the destruction. An official pointed a weapon at him. "Name." "Cuza." "Your relationship to the attacker?" "Someone I know." "Origin?" "Somewhere far away." "Kingdom?" "Far away." "Purpose?" "Looking around." "Did you know this would happen?"\n\nCuza looked at the ruins. "No."\n\nThe official studied him. There wasn't enough evidence to imprison him. They gave him a citizen identification card and temporary citizenship. Then they left. Cuza walked away alone. He never looked back.`},
{title:"Chapter Four — The Party", text:`For days, Cuza traveled alone. He learned about Elaris. Magic existed. Monsters existed. Kingdoms existed. Airships crossed the skies. And warriors could become legends.\n\nOne afternoon, Cuza met four strangers. The first was a red-haired warrior carrying a massive battle axe. "Horway."\n\nThe second was a quiet, serious man in armor. "Ducavice."\n\nThe third was a quiet woman holding a book. "Jess."\n\nThe fourth was tiny. Huge eyes. Tiny paws. It looked up at Cuza. "Silly."\n\nCuza blinked. "That's your name?" "Silly."\n\nHorway laughed. "He doesn't say much." Jess turned a page. "He says enough." Ducavice nodded.\n\nCuza smiled. "I think I'll like him." Silly looked at him. "Silly."\n\nAnd somehow, that became the beginning of a new family. They traveled together. They fought monsters. They shared meals. Horway polished his axe every night. Jess read everywhere. Ducavice watched everything. Silly wandered wherever he pleased.\n\nAnd Cuza began smiling again. He had lost Gren. But Elaris had given him something else. Friends.`},
{title:"Chapter Five — The Black Dragon", text:`Their first great battle came without warning. A black dragon descended from the mountains. Its scales absorbed the sunlight. Its aura crushed trees beneath it.\n\nHorway grinned. "Finally." He charged. His axe struck the dragon. Nothing.\n\nJess unleashed magic. Nothing. Ducavice attacked. Nothing.\n\nThe dragon opened its mouth. Cuza stepped forward. "Everyone move."\n\nThe dragon fired. Cuza raised one hand. The attack disappeared. The dragon stared. Cuza flicked his finger. Golden light crossed the battlefield. The dragon vanished. Silence.\n\nHorway stared. Jess lowered her book. Ducavice looked at Cuza. Silly blinked.\n\nCuza scratched his head. "Lucky hit."\n\nHorway slowly lowered his axe. "That was not luck."\n\nCuza smiled. From that day onward, Cuza became careful. He had realized something. His power wasn't normal. And he wasn't ready for anyone to know how powerful he really was.`},
{title:"Chapter Six — Cara", text:`Eventually, the party reached the Sky Kingdom of Cara. It floated above the clouds. Massive islands drifted through the sky. Airships traveled between them. Magical engines powered entire cities.\n\nCuza learned sky magic. The normal training took twenty days. Cuza understood it in five minutes.\n\nJess stared at him. "I've been teaching you for five minutes."\n\nCuza shrugged. "You're a good teacher."\n\n"That isn't the problem."\n\nHe smiled. Cara became a second home.\n\nCuza also discovered something strange about himself. Money. One day he thought about needing five hundred gold. He reached into his pocket. Five hundred gold appeared. He stared at it. He tried again. A thousand. Again. Ten thousand. He stopped. Nobody saw. He never told anyone.\n\nThen Silly found something. A crystal. Ancient symbols appeared. ANCIENT SEAL DETECTED.\n\nCuza looked up. "That's bad."\n\nThe crystal cracked.`},
{title:"Chapter Seven — The Warrior of Light", text:`The ancient seal shattered. A dragon emerged. It was so enormous that its wings covered half of Cara. People fled. Airships scrambled. The party prepared to fight.\n\nCuza looked around. Too many civilians. Too many lives. He disappeared.\n\nMoments later, a figure appeared above the clouds. Golden armor. Radiant sword. Brilliant light. The Warrior of Light.\n\nThe dragon attacked. Cuza answered. The sky became gold. A tremendous magical explosion flashed across Cara like fireworks. When the light faded, the dragon was gone.\n\nThe people cheered. The King of Cara rushed forward. "The Warrior of Light!" He looked around. "One of my soldiers!"\n\nCuza, still disguised, stared at him. "What a liar."\n\nUnfortunately, he had forgotten to disguise his voice. Jess heard it. She looked toward Cuza's empty position. Then back at the Warrior of Light. Her eyes narrowed.`},
{title:"Chapter Eight — The Age of War", text:`King Lezo made an announcement. "Defeat me, and half my kingdom is yours."\n\nThe announcement changed Elaris. Warriors arrived from every direction. Airships filled Cara's skies. Armies mobilized. Mercenaries gathered. The Age of War had begun.\n\nCuza and his friends joined Cara. Lezo's army marched toward the eastern kingdoms. A gigantic black fortress appeared on the horizon. Warships surrounded it. A voice echoed through the sky. "You have entered the age of war."\n\nCuza looked at the army. Something felt wrong. This wasn't a game. Families were going to die.\n\nAnd soon, the army reached Cara. A dark-crimson dragon descended. Thousands of soldiers rode on its back. Lezo sat upon a black throne. "Cara will fall."\n\nThe prince of Cara stepped forward. He looked at the terrified soldiers. "Our families are behind us." He raised his sword. "Our homes are behind us."\n\nThe army lifted their weapons. "For Cara!" The answer shook the city. "FOR CARA!"\n\nThe battle began.`},
{title:"Chapter Nine — The Warrior of Light Revealed", text:`Magic filled the sky. Airships exploded. Dragons roared. Soldiers clashed. Cuza watched the battlefield. He saw people dying. He saw families fighting. He saw fear. He couldn't stand there anymore.\n\nHe raised his sword. A massive boom echoed across the sky. Light descended. The Warrior of Light appeared.\n\nHorway stared. "That voice…" Jess whispered: "Cuza."\n\nLezo laughed. "So you're the Warrior of Light."\n\nCuza raised his sword. Lezo unleashed Crimson Annihilation. The attack hit. Smoke covered the battlefield. When it cleared— Cuza stood untouched.\n\nLezo's face changed. He transformed. His power increased. He attacked again. Cuza blocked every strike. Finally Cuza said: "Show me."\n\nLezo unleashed everything. Cuza ended the battle. Lezo fell. The army stopped.\n\nLater, Cuza returned to his friends. Horway pointed at him. "You." Cuza smiled. "Me." "You're the Warrior of Light." Jess crossed her arms. "You're terrible at hiding things." Ducavice nodded. "I suspected." Silly raised a paw. "Silly." Cuza laughed. "Yes."`},
{title:"Chapter Ten — The Kingdom of Silly", text:`Cuza received half of the kingdom. He signed the papers. Then someone asked what the new kingdom should be called. Everyone suggested serious names. Silly raised a paw. "Silly."\n\nCuza looked at him. Then smiled. "Kingdom of Silly." And so it was named.\n\nPeople moved there. Thousands became hundreds of thousands. Then millions. Everyone believed the Warrior of Light lived there. The kingdom ran out of space.\n\nCuza walked beyond its borders. He looked across the empty horizon. Then he reached into the air. Magic moved. Atoms rearranged. Land appeared. Mountains rose. Fields formed. Roads stretched across the new territory. The kingdom expanded. Silly became enormous.\n\nCuza stood on the castle balcony. Jess joined him. "You created all of this."\n\nCuza smiled. "Maybe."\n\nShe shook her head. "You are impossible."\n\nHe laughed. For the first time, Cuza had a home.`},
{title:"Chapter Eleven — The Black Airships", text:`Peace lasted. Then black airships appeared. They covered the sky. A voice echoed across Silly. "Kingdom of Silly." Cuza stepped onto the balcony. "You have been summoned." A pause. "Refusal is not an option."\n\nMillions gathered below. The Warrior of Light appeared beside Cuza. The people cheered.\n\nThen a stranger appeared. "Gren is coming."\n\nCuza froze. A figure appeared above the airships. Gren. Older. Stronger. Different. He looked at Cuza. "Cuza." He smiled. "I was close." His expression hardened. "SOO close." Then he vanished.\n\nThe enemy fleet opened fire. Thousands of attacks descended. Cuza had already prepared. An invisible dome surrounded the kingdom. Every attack hit it. Every attack bounced away. Millions survived.\n\nCuza looked toward the horizon. "Gren."`},
{title:"Chapter Twelve — The Friend Who Returned", text:`Gren had not simply disappeared. He had been manipulated. A man had taken advantage of him. His anger. His loneliness. His desire for power. The man twisted his memories and convinced him that Cuza was the reason everything had gone wrong.\n\nGren became stronger. Not stronger than Cuza. But close. Very close. His abilities were measurable. His limits could be seen. Cuza's could not. That difference frightened Gren. Because every time they fought, Cuza always seemed to have something left.\n\nBack in Silly, Jess found Cuza alone. "You're afraid." Cuza looked at her. "Yes." "Of Gren?" "Yes." She waited. "Because he's strong?" Cuza shook his head. "Because I know him."\n\nJess understood. Meanwhile, Gren stood with the man who had manipulated him. "You still hesitate," the man said. Gren looked toward Silly. "No." "You're lying." Gren clenched his fist. "I'll defeat him." But somewhere inside him, his old memories were beginning to return.`},
{title:"Chapter Thirteen — The Colossus", text:`The largest enemy airship opened. A gigantic machine stepped out. The Colossus. Black armor covered its body. Its sword was enormous. It had been designed to destroy kingdoms.\n\nThe Colossus struck Silly's protective dome. BOOM. Cracks appeared. Again. BOOM. The dome began failing.\n\nCuza walked outside. Horway shouted: "CUZA!" The Colossus swung. Cuza raised one hand. He caught the sword. The entire battlefield went silent. Cuza looked at it. "That's pretty heavy."\n\nThe machine pushed. Cuza didn't move. He pushed back. The Colossus staggered. Cuza looked toward the machine. "This needs a bigger machine."\n\nBehind him, the Warrior of Light raised his sword. Light flashed. Every enemy airship was sliced into a million pieces. The soldiers below collapsed unconscious. Cuza teleported them to Hewery.\n\nThe battle ended. But Gren was still coming.`},
{title:"Chapter Fourteen — The Message", text:`The defeated commander was taken to Hewery. He smiled. "I know who the Warrior of Light is." The leaders listened. "He isn't the strongest person in Silly." Silence. "There's someone else."\n\nMeanwhile, a stranger approached Silly. He appeared above the castle. "You're Cuza." Cuza looked at him. "Who are you?" "A messenger." "From whom?" "Someone who knows what you really are."\n\nCuza said nothing. The stranger continued. "Gren is coming." A pause. "This time, he isn't alone." Then the stranger vanished.\n\nCuza looked at his kingdom. His people. His family. His friends. He turned toward Jess. "This is my fault." "No." "Let me finish what I started." He flew into the sky.`},
{title:"Chapter Fifteen — The Greatest Battle", text:`The sky was empty. Cuza waited. Then Gren appeared. They looked at each other. No armies surrounded them. No audience. No kingdom. Only clouds.\n\n"Cuza." "Gren." Gren smiled. "I missed this." Cuza lowered his sword. "So did I."\n\nGren attacked. The first impact split the clouds. The second shook mountains. The third sent a shockwave across Elaris. Gren's magic formed enormous blades. Cuza avoided them. Lightning covered the sky. Gren moved through it. Cuza blocked. Gren struck. Cuza countered. They moved faster than any ordinary warrior could follow.\n\nGren's power increased. Cuza still hadn't shown his limit. Gren noticed. "You're still holding back." Cuza said nothing. "So am I." They collided. The sky became light. They crashed through clouds. They fought across mountains. They exchanged hundreds of blows.\n\nGren pushed himself further. His magic reached its highest known limit. Cuza remained standing. Gren laughed. "I knew it." "What?" "You never showed me everything." Cuza smiled sadly. "No."\n\nGren attacked one final time. Cuza met him. Their fists collided. A shockwave crossed the world. Then— silence. Neither had won. Neither had lost. They simply stood there. Exhausted. Two friends who had become enemies. Two enemies who still remembered being friends.`},
{title:"Chapter Sixteen — Acra and Gruean", text:`Gren looked at Cuza. "Acra." Cuza looked back. "Gruean." The old names. Names from before Elaris. Before the kingdoms. Before the war. Before everything.\n\nGren laughed. "We really ended up here." Cuza nodded. "I guess we did." Gren looked toward the horizon. "I remember the rain." "So do I." "The fall." "The plateau." "Gronsrock." Cuza looked down. "I wish that had gone differently." Gren smiled. "So do I."\n\nThey stood together for a moment. Then Gren turned away. "I'm gonna miss you." Cuza's eyes softened. "Me too." Gren walked away. Cuza didn't follow. Some goodbyes weren't meant to be stopped.\n\nTheir battle became the greatest battle in Elaris history. But Cuza remembered something else. Two boys. One rainy night. Two hands reaching for each other in the darkness.`},
{title:"Chapter Seventeen — Seven Years", text:`Seven years passed. Silly grew. Its cities became enormous. Airships traveled between districts. Markets stretched for miles. The kingdom became one of the richest powers in Elaris.\n\nCuza was still King. Jess was Queen. Horway had become commander of the royal army. His hair was still red. His collection of battle scars had grown. His love for his axe had somehow grown even more. Ducavice became chief protector. He remained quiet. Strong. Serious. Both men had families now.\n\nAnd Cuza had his own. A thirteen-year-old son. A six-year-old daughter. One evening, Jess sat reading on the balcony. Cuza sat beside her. Silly slept on his lap. Their son leaned against the railing. Their daughter ran around the courtyard.\n\nCuza looked across his kingdom. He remembered arriving in Elaris. He remembered having nothing. Now he had everything.`},
{title:"Chapter Eighteen — The First World War", text:`Peace did not last forever. The Verdant Alliance attacked Silly. The alliance consisted of forest kingdoms: Thornvale, Mossreach, Elderwood, Greenfall, Wildmere, Roothelm, and the central Verdant Alliance leadership.\n\nSilly's allies responded. Cara. Hewery. Eldermere. The Northern Free States. The declaration was simple. "An attack on one is an attack on all." The First World War began.\n\nThe Ashen Empire fought the Verdant forces in the east. Silly fought them in the west. Cara fought them in the sky. Millions mobilized. Cities built bunkers. Airships filled the clouds. Trade routes collapsed. Families separated.\n\nCuza stood over a battlefield. He saw thousands of soldiers preparing to attack each other. He raised his hand. Jess watched from afar. She knew what he was about to do.\n\nThousands of magical circles appeared across the sky. One. Ten. One hundred. Thousands. Fire. Lightning. Wind. Water. Earth. Light. Gravity. Space. Magic itself. They combined. A golden sphere appeared. It grew. City-sized. Mountain-sized. Larger. The armies stopped.\n\nCuza looked down. "I don't want a war." The sphere transformed. Not into destruction. Into a barrier. A gigantic golden wall rose from the earth to the heavens. Every attack vanished. The battlefield became silent.\n\nThe war ended. Not because one side had conquered the other. Because Cuza refused to let another generation be destroyed.`},
{title:"Chapter Nineteen — Peace", text:`The nations met. Borders were redrawn. Armies were reduced. Trade reopened. Smaller kingdoms received protection. The Elaris Peace Alliance was created. For the first time in years, the continent began rebuilding.\n\nEight years passed. Silly became even larger. Cuza and Jess ruled together. Their son grew. Their daughter remained energetic. Horway commanded the army. Ducavice protected the royal family. Silly remained peaceful.\n\nThen an invitation arrived. The Elaris Peace Alliance was holding its first major meeting. Every major nation was invited. Cuza entered the Grand Hall with Jess, Horway and Ducavice. Nearly every ruler in Elaris sat around the enormous circular table.\n\nCuza looked around. "Wow." Horway smiled. "Everyone actually showed up." "Of course they did." Ducavice looked at Cuza. "You ended the last war." Cuza shrugged. "I barely remember doing that." Jess looked at him. "You stopped an entire army formation in three seconds." Cuza smiled. "Exactly." "Barely."\n\nThe meeting began. Borders. Trade. Military limits. Magical weapons. Protection of smaller kingdoms. It was the beginning of a new era.\n\nThen a document appeared on the table. The words were written in black ink. THE PEACE OF ELARIS ENDS TONIGHT. The hall went silent. Black feathers appeared. Windows shattered. A voice echoed through the room. "You gathered every ruler into one place." A magical seal appeared beneath the floor. Ducavice stared at the symbol. "The Black Crown." The nation had officially disappeared thirty years earlier.\n\nCuza raised one hand. The seal vanished. The entire room stared. Cuza sighed. "Can we please have one meeting without someone trying to destroy the world?" Jess closed her book. "Apparently not."`},
{title:"Chapter Twenty — The Last Shadow", text:`The Black Crown never returned that night. The mysterious threat disappeared. The rulers continued their work. Peace survived. For a while.\n\nCuza remained cautious. He knew Elaris would never become completely safe. There would always be monsters. There would always be people seeking power. There would always be someone who believed war was the answer. But Silly had become strong enough to survive. And Cuza had something worth protecting. His family.\n\nOne afternoon, his daughter disappeared. Cuza found her in a training room. She held a wooden spoon. His son held a wooden sword. Cuza stared. "What are you two doing?" "Training." "No." His daughter raised the spoon. "Fighting." "You're six." "I can beat Horway." Cuza laughed. "You?" "Yes."\n\nHorway entered. "What did I hear?" The girl pointed the spoon at him. "You." Horway looked at Cuza. Cuza was already laughing. "Fine," Horway said. The fight began. The girl charged. Horway raised his battle axe. She swung the spoon. BONK. Horway flew backward. Straight into a bush. Silence. He slowly emerged. "I have been defeated…" He looked at the spoon. "…by a spoon." Cuza nearly fell over laughing.`},
{title:"Chapter Twenty-One — The Next Generation", text:`Later, Cuza's son challenged him. The boy held a wooden sword. Cuza held a stick. "Ready?" The boy attacked. Fast. Cuza blocked. Another strike. Blocked. Another. Blocked. The boy changed direction. Cuza followed. The boy jumped. Cuza stepped aside. Then the boy kicked the ground. A tiny burst of magic launched him upward. Cuza caught the wooden sword. The boy landed. Everyone went silent.\n\nJess looked at her son. Cuza smiled. "You've got your mother's talent." He paused. "And maybe something else." The boy looked excited. His sister raised her spoon. "ME NEXT!" Cuza stared at her. "No." "YES." "No." "YES." Jess laughed. Cuza sighed. "I'm going to regret this." Horway whispered: "You already do." Cuza pointed at him. "You stay away from the spoon." Horway immediately stepped backward.`},
{title:"Chapter Twenty-Two — Home", text:`Evening arrived. The castle balcony overlooked the kingdom. Lights stretched across Silly. Airships moved peacefully between cities. Children played in the streets. Markets remained open. Music drifted upward.\n\nCuza sat with Jess. Their son leaned against him. Their daughter slept beside Jess. Silly slept on Cuza's lap. Horway stood nearby with his family. Ducavice stood with his. Nobody was fighting. Nobody was dying. Nobody was running. There was no dragon in the sky. No enemy fleet. No war. No ancient seal. Just a peaceful evening.\n\nJess looked at Cuza. "You've come a long way." Cuza smiled. "So have you." Horway raised his cup. "To Silly." Ducavice nodded. "To peace." Jess smiled. "To family."\n\nCuza looked at the kingdom. He remembered everything. The rainy night. The crack. The fall. The endless darkness. Elaris. Gronsrock. Gren. Jess. Horway. Ducavice. Silly. Cara. The dragons. The wars. The Warrior of Light. The Kingdom of Silly. The Greatest Battle. The Peace Alliance. His children. His family.\n\nHe looked down at Silly. The little creature opened one eye. "Silly." Cuza smiled. "Silly."\n\nThe kingdom's lights stretched all the way to the horizon. His daughter shifted in her sleep. His son leaned closer. Jess closed her book. Cuza looked at them. "This isn't a bad ending." Jess smiled. "No." "It isn't."\n\nThe sun disappeared. The stars appeared. The castle became quiet. The people of Silly slept safely. For once, Cuza didn't have to prepare for tomorrow's battle. He didn't have to hide behind a disguise. He didn't have to become the Warrior of Light. He didn't have to save the world. He could simply be Cuza. A husband. A father. A friend. A king. A man who had fallen into another world and somehow found a home.\n\nAnd somewhere beyond the mountains, Elaris continued. There would be new adventures. New generations. New stories. But tonight belonged to peace.\n\nCuza looked at Jess. She looked back. Neither needed to say anything. They already understood. They had survived the impossible. And now— they could live.\n\nThe lights of Silly shimmered beneath the stars. Silly snored. Cuza laughed quietly. His daughter smiled in her sleep. His son closed his eyes. Jess rested her head against Cuza. The night continued. Not because their world had ended. But because, for once... they were allowed to simply live.\n\n— END OF BOOK ONE —`}
];

function splitEven(total, parts){
  const base = Math.floor(total/parts), rem = total%parts, out=[];
  for(let i=0;i<parts;i++) out.push(base + (i<rem?1:0));
  return out;
}
const ARC_PLAN = [
  {name:"Earth Fall", books:["Two Names Before the Fall","The Plateau of Glass","The Lie of Eldermere","What Gronsrock Remembers"], chapters:27},
  {name:"Gronsrock Split", books:["Shards and Silver","The Merchant's Ledger","What the Guards Ignored","The Fire in Gronsrock","Ashes and Citizenship"], chapters:27},

];
function buildBookPlan(){
  const books = [{num:1, title:"The Rain That Would Not Stop", subtitle:"Book One — the seed chronicle, kept as first written", arc:"Genesis (Seed Chronicle)", chStart:1, chCount:23, seeded:true,
    summary:"The condensed manuscript you began with, preserved intact: the fall from Earth, Gronsrock's ruin, the Warrior of Light, the founding of Silly, the war with Gren, and the family that came after. Everything that follows expands on what is written here — it does not contradict it."}];
  let ch = 24, num = 2;
  for(const arc of ARC_PLAN){
    const sizes = splitEven(arc.chapters, arc.books.length);
    arc.books.forEach((title,i)=>{
      const count = sizes[i];
      books.push({num, title, subtitle:null, arc:arc.name, chStart:ch, chCount:count, seeded:false,
        summary:`Part of the ${arc.name} arc, expanding chapters ${ch}–${ch+count-1} in fuller detail than the seed chronicle covers.`});
      ch += count; num++;
    });
  }
  return books;
}
const BOOK_PLAN = buildBookPlan(); // 30 entries
const TOTAL_CHAPTERS = BOOK_PLAN.reduce((s,b)=>s+b.chCount,0); // 214
const PAGES_PER_CHAPTER = 12;
const TOTAL_PAGES = TOTAL_CHAPTERS*PAGES_PER_CHAPTER; // 2568

function bookForChapter(chNum){ return BOOK_PLAN.find(b=> chNum>=b.chStart && chNum < b.chStart+b.chCount); }
function chapterTitleFallback(chNum, book){
  const local = chNum - book.chStart + 1;
  return `Chapter ${chNum} — ${book.title}, part ${local}`;
}

const Store = {
  db: null, ready: false,
  async init(){
    try{ this.db = await claude.use("db"); }catch(e){ this.db = null; }
    this.ready = true;
    return !!this.db;
  },
  lsKey(path){ return "elaris::"+path; },
  async get(path){
    if(this.db){
      try{
        const snap = await this.db.doc(path).get();
        return snap.exists ? snap.data() : null;
      }catch(e){ /* fall through to local cache below */ }
    }
    try{ const raw = localStorage.getItem(this.lsKey(path)); return raw ? JSON.parse(raw) : null; }catch(e){ return null; }
  },
  async set(path, data){
    let ok = false;
    if(this.db){
      try{ await this.db.doc(path).set(data); ok = true; }catch(e){ ok = false; }
    }
    try{ localStorage.setItem(this.lsKey(path), JSON.stringify(data)); }catch(e){}
    return ok || true;
  }
};

/* ---------------- App state ---------------- */
const State = {
  books: BOOK_PLAN,
  chapters: [], // 214 entries: {num,title,arc,bookNum,pages:[{text,wordCount,status}]}
  encyclopedia: null,
  continuity: null, // {log:[...], curBook, curChapter, curPage}
  settings: {theme:"auto", fontSize:1.14, lineHeight:1.75, width:68, align:"left", batchSize:3, autoAdvance:true},
  bookmarks: [], notes: [],
  view: "reader",
  sampleFn: null, downloadsFn: null,
};

function emptyPage(){ return {text:"", wordCount:0, status:"locked"}; }
function initChapters(){
  const chapters = [];
  let seedIdx = 0;
  for(const book of State.books){
    for(let i=0;i<book.chCount;i++){
      const chNum = book.chStart + i;
      let title = chapterTitleFallback(chNum, book);
      const pages = [];
      if(book.seeded){
        const seed = SEED_CHAPTERS[seedIdx]; seedIdx++;
        title = seed.title;
        const paras = seed.text.split("\n\n").filter(Boolean);
        // distribute paragraphs across up to 12 pages, first pages carry the text, rest stay locked
        const perPage = Math.max(1, Math.ceil(paras.length / PAGES_PER_CHAPTER));
        for(let p=0;p<PAGES_PER_CHAPTER;p++){
          const slice = paras.slice(p*perPage, (p+1)*perPage);
          if(slice.length){
            const text = slice.join("\n\n");
            pages.push({text, wordCount: text.split(/\s+/).filter(Boolean).length, status:"complete"});
          } else pages.push(emptyPage());
        }
      } else {
        for(let p=0;p<PAGES_PER_CHAPTER;p++) pages.push(emptyPage());
      }
      chapters.push({num:chNum, title, arc:book.arc, bookNum:book.num, pages});
    }
  }
  return chapters;
}

function chapterStatus(ch){
  const done = ch.pages.filter(p=>p.status==="complete").length;
  if(done===0) return "locked";
  if(done===ch.pages.length) return "complete";
  return "progress";
}
function bookStatus(book){
  const chs = State.chapters.filter(c=>c.bookNum===book.num);
  const done = chs.filter(c=>chapterStatus(c)==="complete").length;
  if(done===0) return "locked";
  if(done===chs.length) return "complete";
  return "progress";
}
function globalPageIndex(chNum, pageIdx){ return (chNum-1)*PAGES_PER_CHAPTER + pageIdx; }
function wordsTotal(){
  let w=0; for(const c of State.chapters) for(const p of c.pages) w+=p.wordCount||0; return w;
}
function pagesCompleteCount(){
  let n=0; for(const c of State.chapters) for(const p of c.pages) if(p.status==="complete") n++; return n;
}

/* ---------------- Persistence: load / save ---------------- */
async function loadAll(){
  await Store.init();
  const savedChapters = await Store.get("elaris/chapters");
  const savedEnc = await Store.get("elaris/encyclopedia");
  const savedCont = await Store.get("elaris/continuity");
  const savedSettings = await Store.get("elaris/settings");
  const savedBookmarks = await Store.get("elaris/bookmarks");
  const savedNotes = await Store.get("elaris/notes");

  State.chapters = (savedChapters && savedChapters.list && savedChapters.list.length===TOTAL_CHAPTERS) ? savedChapters.list : initChapters();
  State.encyclopedia = savedEnc || JSON.parse(JSON.stringify(SEED_ENCYCLOPEDIA));
  State.continuity = savedCont || {log:[], curChapter:1, curPage:0};
  State.settings = Object.assign({}, State.settings, savedSettings||{});
  State.bookmarks = savedBookmarks && savedBookmarks.list || [];
  State.notes = savedNotes && savedNotes.list || [];

  if(!savedChapters) await persistChapters();
  if(!savedEnc) await Store.set("elaris/encyclopedia", State.encyclopedia);
  if(!savedCont) await Store.set("elaris/continuity", State.continuity);
}
let chaptersDirty = false, chaptersSaveTimer = null;
async function persistChapters(){ await Store.set("elaris/chapters", {list: State.chapters}); }
function queueSaveChapters(){
  chaptersDirty = true;
  clearTimeout(chaptersSaveTimer);
  chaptersSaveTimer = setTimeout(async ()=>{ if(chaptersDirty){ await persistChapters(); chaptersDirty=false; } }, 600);
}
async function persistContinuity(){ await Store.set("elaris/continuity", State.continuity); }
async function persistEncyclopedia(){ await Store.set("elaris/encyclopedia", State.encyclopedia); }
async function persistSettings(){ await Store.set("elaris/settings", State.settings); }
async function persistBookmarks(){ await Store.set("elaris/bookmarks", {list: State.bookmarks}); }
async function persistNotes(){ await Store.set("elaris/notes", {list: State.notes}); }

/* ----- Reader view ----- */
function findNextReadable(chNum, pageIdx){
  for(let c=chNum;c<=TOTAL_CHAPTERS;c++){
    const chapter = State.chapters[c-1];
    const startP = (c===chNum)? pageIdx+1 : 0;
    for(let p=startP;p<PAGES_PER_CHAPTER;p++){
      if(chapter.pages[p].status==="complete") return {chNum:c, pageIdx:p};
    }
  }
  return null;
}
function findPrevReadable(chNum, pageIdx){
  for(let c=chNum;c>=1;c--){
    const chapter = State.chapters[c-1];
    const upto = (c===chNum)? pageIdx-1 : PAGES_PER_CHAPTER-1;
    for(let p=upto;p>=0;p--){
      if(chapter.pages[p].status==="complete") return {chNum:c, pageIdx:p};
    }
  }
  return null;
}
function renderReader(body){
  const {chNum, pageIdx} = currentReading;
  const chapter = State.chapters[chNum-1];
  const book = bookForChapter(chNum);
  const page = chapter.pages[pageIdx];
  const gp = globalPageIndex(chNum,pageIdx)+1;
  const nextPos = findNextReadable(chNum, pageIdx);
  const prevPos = findPrevReadable(chNum, pageIdx);
  body.innerHTML = `
    <div class="reader-wrap">
      <div class="reader-crumb">Book ${book.num} · ${book.title} — Arc: ${book.arc}</div>
      <div class="reader-title">${chapter.title}</div>
      <div class="reader-sub">Page ${pageIdx+1} of ${PAGES_PER_CHAPTER} · Global page ${gp} of ${TOTAL_PAGES}</div>
      <div class="page-progress"><div style="width:${(gp/TOTAL_PAGES*100).toFixed(2)}%"></div></div>
      ${page.status==="complete" ? `
        <div class="page-text">${page.text.split("\n\n").map(p=>`<p>${escapeHtml(p)}</p>`).join("")}</div>
        <div style="text-align:center;color:var(--text-dim);font-size:.78rem;margin-top:18px;">${page.wordCount} words · ~${Math.max(1,Math.round(page.wordCount/220))} min read</div>
      ` : `
        <div class="empty-state" style="margin-top:60px;">
          <h3>End of available story</h3>
          <p>You've reached the end of the written chapters. Use Previous to go back.</p>
        </div>
      `}
      <div class="reader-nav">
        <button class="btn btn-ghost" id="btn-prev-page" ${!prevPos?"disabled":""}>← Previous</button>
        <span class="pagenum">Ch. ${chNum} / ${TOTAL_CHAPTERS}</span>
        <button class="btn btn-ghost" id="btn-next-page" ${!nextPos?"disabled":""}>Next →</button>
      </div>
      <div class="gen-row" style="max-width:68ch;margin:14px auto 0;justify-content:center;">
        <button class="btn" id="btn-bookmark-here">🔖 Bookmark this page</button>
      </div>
    </div>
  `;
  document.getElementById("btn-prev-page")?.addEventListener("click", ()=>{
    if(prevPos){ currentReading = prevPos; localStorage.setItem("elaris::lastread", JSON.stringify(currentReading)); render(); }
  });
  document.getElementById("btn-next-page")?.addEventListener("click", ()=>{
    if(nextPos){ currentReading = nextPos; localStorage.setItem("elaris::lastread", JSON.stringify(currentReading)); render(); }
  });
  document.getElementById("btn-bookmark-here")?.addEventListener("click", ()=>{
    State.bookmarks.push({id:Date.now(), chNum, pageIdx, title:chapter.title, note:"", ts:new Date().toISOString()});
    persistBookmarks(); showToast("Bookmarked.");
  });
}
function escapeHtml(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

/* ----- Chapters / Books view ----- */
function renderChapters(body){
  body.innerHTML = `

    card.className = "card";
    card.innerHTML = `

/* ----- Search ----- */
function renderSearch(body){
  body.innerHTML = `
    <div class="section-title">Search</div>
    <input type="search" id="search-input" placeholder="Search chapters, dialogue, characters, notes…" style="max-width:480px;margin-bottom:18px;">
    <div id="search-results"></div>
  `;
  const input = document.getElementById("search-input");
  const results = document.getElementById("search-results");
  input.addEventListener("input", ()=>{
    const q = input.value.trim().toLowerCase();
    if(q.length<2){ results.innerHTML=""; return; }
    const hits = [];
    for(const ch of State.chapters){
      if(ch.title.toLowerCase().includes(q)) hits.push({type:"Chapter", ctx:`Chapter ${ch.num}`, title:ch.title, snip:"", go:()=>{currentReading={chNum:ch.num,pageIdx:0};State.view="reader";render();}});
      ch.pages.forEach((p,i)=>{
        if(p.status==="complete" && p.text.toLowerCase().includes(q)){
          const idx = p.text.toLowerCase().indexOf(q);
          const snip = p.text.slice(Math.max(0,idx-50), idx+80);
          hits.push({type:"Page", ctx:`${ch.title} — page ${i+1}`, title:snip, snip:"", go:()=>{currentReading={chNum:ch.num,pageIdx:i};State.view="reader";render();}});
        }
      });
    }
    for(const cat of ["characters","nations","locations","magic","factions"]){
      for(const [name,entry] of Object.entries(State.encyclopedia[cat]||{})){
        const blob = (name+" "+JSON.stringify(entry)).toLowerCase();
        if(blob.includes(q)) hits.push({type:"Encyclopedia", ctx:cat, title:name, snip:entry.description||"", go:()=>{State.view="characters"; render();}});
      }
    }
    for(const n of State.notes){ if((n.text||"").toLowerCase().includes(q)) hits.push({type:"Note", ctx:"Note", title:n.text.slice(0,60), snip:"", go:()=>{State.view="notes";render();}}); }
    results.innerHTML = hits.length? "" : `<div class="empty-state"><h3>No matches</h3></div>`;
    hits.slice(0,60).forEach(h=>{
      const row = document.createElement("div");
      row.className = "result-item";
      row.innerHTML = `<div class="result-ctx">${h.type} · ${h.ctx}</div><div class="result-title">${escapeHtml(h.title)}</div>${h.snip?`<div class="result-snip">${escapeHtml(h.snip)}</div>`:""}`;
      row.onclick = h.go;
      results.appendChild(row);
    });
  });
}

  `;
  document.getElementById("set-theme").onchange = (e)=>{ s.theme=e.target.value; persistSettings(); applyTheme(); };
  document.getElementById("set-fontsize").oninput = (e)=>{ s.fontSize=parseFloat(e.target.value); persistSettings(); applyTheme(); };
  document.getElementById("set-lh").oninput = (e)=>{ s.lineHeight=parseFloat(e.target.value); persistSettings(); applyTheme(); };
  document.getElementById("set-width").oninput = (e)=>{ s.width=parseInt(e.target.value,10); persistSettings(); applyTheme(); };
  document.getElementById("set-align").onchange = (e)=>{ s.align=e.target.value; persistSettings(); applyTheme(); };

  document.getElementById("btn-export-json").onclick = async ()=>{
    const backup = {exportedAt:new Date().toISOString(), chapters:State.chapters, encyclopedia:State.encyclopedia, continuity:State.continuity, bookmarks:State.bookmarks, notes:State.notes, settings:State.settings};
    await offerDownload("elaris-backup.json", JSON.stringify(backup, null, 2));
  };
  document.getElementById("btn-export-md").onclick = async ()=>{
    let md = "# ELÁRIS\n\n";
    for(const book of State.books){
      md += `\n## Book ${book.num}: ${book.title}\n\n`;
      for(const ch of State.chapters.filter(c=>c.bookNum===book.num)){
        md += `### Chapter ${ch.num}: ${ch.title}\n\n`;
        for(const p of ch.pages){ if(p.status==="complete") md += p.text + "\n\n"; }
      }
    }
    await offerDownload("elaris-novel.md", md);
  };
  document.getElementById("import-file").onchange = async (e)=>{
    const file = e.target.files[0]; if(!file) return;
    const status = document.getElementById("settings-status");
    try{
      const text = await file.text();
      const data = JSON.parse(text);
      if(data.chapters) State.chapters = data.chapters;
      if(data.encyclopedia) State.encyclopedia = data.encyclopedia;
      if(data.continuity) State.continuity = data.continuity;
      if(data.bookmarks) State.bookmarks = data.bookmarks;
      if(data.notes) State.notes = data.notes;
      if(data.settings) State.settings = Object.assign({}, State.settings, data.settings);
      await Promise.all([persistChapters(), persistEncyclopedia(), persistContinuity(), persistBookmarks(), persistNotes(), persistSettings()]);
      status.textContent = "Backup imported successfully.";
      showToast("Backup imported.");
      render();
    }catch(err){ status.textContent = "Import failed: file isn't a valid Elaris backup."; }
  };
}
async function offerDownload(filename, text){
  if(!State.downloadsFn){ try{ State.downloadsFn = await claude.use("downloads"); }catch(e){ State.downloadsFn=null; } }
  if(State.downloadsFn){
    try{ await State.downloadsFn.save({filename, data:text}); showToast("Saved "+filename); return; }catch(e){ /* fall through */ }
  }
  showToast("Download isn't available in this view — try opening the artifact in a supporting client.");
}

/* ---------------- Boot ---------------- */
async function boot(){
  document.getElementById("cover-note").textContent = "Loading your saga…";
  await loadAll();
  const last = (()=>{ try{ return JSON.parse(localStorage.getItem("elaris::lastread")); }catch(e){ return null; } })();
  if(last && State.chapters[last.chNum-1]) currentReading = last;
  document.getElementById("cover-note").textContent =
    `${pagesCompleteCount().toLocaleString()} of ${TOTAL_PAGES.toLocaleString()} pages written · ${wordsTotal().toLocaleString()} words so far`;
  render();
}
document.getElementById("btn-start-reading").onclick = ()=>{ document.getElementById("cover").classList.add("hidden"); State.view="reader"; render(); };
boot();
</script>
</body>
